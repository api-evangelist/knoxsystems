aid: knoxsystems
name: Knox Systems
description: >-
  Knox Systems is a federal cloud compliance and managed-security company that
  provides an accelerated path to FedRAMP authorization for SaaS and AI vendors
  selling into the U.S. government, marketed as "FedRAMP in 90 days for 90% less."
  Its platform combines a pre-authorized FedRAMP boundary, a deployable Landing
  Zone, hardened images, and Knox AI — a continuous-monitoring and automated
  remediation engine trained on federal audit data — running across AWS, Azure,
  and GCP at FedRAMP Moderate, FedRAMP High, and DISA Impact Level 4. Vendors
  inherit Knox's authorization and controls rather than pursuing an independent
  ATO, and Knox reports 15+ authorizations to operate across federal and DoD
  agencies including DHS, FEMA, the Marine Corps, Treasury, and the VA. Knox
  Systems is a private company backed by Felicis, and operates a partner-led
  business rather than a public developer API program — as of this enrichment
  pass it publishes no public API, developer portal, SDKs, or API documentation.
